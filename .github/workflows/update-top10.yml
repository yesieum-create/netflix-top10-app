# 매일 아침 자동 실행 → server/output/top10.json 갱신 → GitHub Pages 로 공개 → 앱이 읽음
# (Tudum 은 주 1회 화요일경 갱신, FlixPatrol 일간 트렌드 때문에 매일 실행)
name: update-top10

on:
  schedule:
    - cron: "0 23 * * *"   # 매일 한국시간 08:00
  workflow_dispatch: {}     # GitHub 화면에서 '지금 실행' 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt
      - name: Run pipeline
        working-directory: server
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FLIXPATROL_API_KEY: ${{ secrets.FLIXPATROL_API_KEY }}
          FLIXPATROL_ENDPOINT: ${{ secrets.FLIXPATROL_ENDPOINT }}
        run: python pipeline.py
      - name: Publish JSON to docs/ (GitHub Pages)
        run: |
          mkdir -p docs
          cp server/output/top10.json docs/top10.json
          git config user.name "top10-bot"
          git config user.email "top10-bot@users.noreply.github.com"
          git add docs/top10.json server/cache/
          git diff --cached --quiet || git commit -m "data: update top10 $(date -u +%F)"
          git push
